name: CI
# Lưới "máy gác" mô hình trunk: chặn PR/đẩy main nếu bộ test khói (smoke) hỏng.
# site-guard là gói bảo vệ site → test tự chạy server nội bộ + kiểm CSRF/turnstile/perf.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cài đặt
        run: npm install   # repo chưa có package-lock → dùng npm install
      - name: Test
        run: npm test
